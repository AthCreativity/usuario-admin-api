name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore UsuarioAdminApi.slnx

      - name: Build
        run: dotnet build UsuarioAdminApi.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/UsuarioAdminApi.Tests/UsuarioAdminApi.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'

      - name: Run Trivy vulnerability scanner (report only)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
